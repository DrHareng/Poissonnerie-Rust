[package]
name = "poissonnerie-elo"
version = "0.1.0"
edition = "2021"
description = "Application de classement ELO"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["cors"] }
tower-sessions = "0.14"
urlencoding = "2"
rand = { version = "0.9", features = ["std", "std_rng"] }

[lib]
name = "poissonnerie_elo"
path = "src/lib.rs"

[[bin]]
name = "poissonnerie-elo"
path = "src/main.rs"

[[bin]]
name = "poissonnerie-server"
path = "src/bin/server.rs"

[[bin]]
name = "poissonnerie-sync-armies"
path = "src/bin/sync-armies.rs"

[[bin]]
name = "poissonnerie-import-coupe4"
path = "src/bin/import-coupe4.rs"

[[bin]]
name = "poissonnerie-import-coupe"
path = "src/bin/import-coupe.rs"

[[bin]]
name = "poissonnerie-merge-players"
path = "src/bin/merge-players.rs"

[[bin]]
name = "poissonnerie-fix-tournament-armies"
path = "src/bin/fix-tournament-armies.rs"
